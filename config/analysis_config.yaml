# Konfigurasi analisis klasterisasi murni (Tahap 1): scripts/cluster_analysis.py
# Berkas terpisah agar config/default_config.yaml tidak berubah. Parameter data (kolom CSV, filter VOIP label) tetap dari default_config.yaml.
analysis:
  random_state: 42
  output_dir: reports/experiments            # laporan cluster_analysis.md; grafik di <output_dir>/cluster_analysis/
  cleaning:
    drop_duplicates: true                    # duplikat = baris identik pada semua kolom yang dimuat
    drop_negative: true                      # nilai fitur mentah negatif dibuang
    nan_strategy: median                     # NaN/inf pada fitur diisi median (sama dengan pipeline lama)
    iqr_factor: 1.5                          # batas nilai ekstrem: Q1 - f*IQR dan Q3 + f*IQR
  features:                                  # varian fitur; kolom turunan: fai_pct, total_packets (fwd + bwd)
    base:
      columns: [iat_mean_us, iat_std_us, fai_pct]
      log1p: [iat_mean_us, iat_std_us]       # FAI tidak di-log
    dengan_total_paket:
      columns: [iat_mean_us, iat_std_us, fai_pct, total_packets]
      log1p: [iat_mean_us, iat_std_us, total_packets]
  fai_clip_negative: true
  sets:                                      # himpunan data; runs = himpunan x varian fitur
    - name: semua_voip_dengan_tor            # himpunan UTAMA
      title: Semua VOIP termasuk Tor (fwd >= 1)
      exclude_traffic_types: []
      min_fwd: 1                             # syarat teknis agar FAI terdefinisi
      min_bwd: null
      feature_variants: [base, dengan_total_paket]
      primary: true
    - name: semua_voip_tanpa_tor
      title: Semua VOIP tanpa Tor (fwd >= 1)
      exclude_traffic_types: [Tor]
      min_fwd: 1
      min_bwd: null
      feature_variants: [base]
    - name: sesi_5_5_tanpa_tor
      title: fwd >= 5 dan bwd >= 5 tanpa Tor (konfigurasi lama)
      exclude_traffic_types: [Tor]
      min_fwd: 5
      min_bwd: 5
      feature_variants: [base]
  kmeans:
    k_min: 2
    k_max: 10
    n_init: 10
  hdbscan:
    min_cluster_size: [5, 10, 25, 50, 100]
    min_samples: [1, 5, 10, 20]
    cluster_selection_method: eom
  selection:
    kmeans_rank_metrics: [silhouette, davies_bouldin]   # rata-rata peringkat; seri -> k lebih kecil. CHI hanya pendukung (cenderung naik dengan k)
    hdbscan_min_clusters: 2
    hdbscan_max_noise_ratio: 0.5
    hdbscan_primary_metric: dbcv                        # dipilih maksimum di antara kombinasi yang memenuhi batas; seri -> silhouette
  stability:
    n_bootstrap: 50
    fraction: 0.8
  timing:
    repeats: 3                                          # ulangi pengukuran waktu, ambil median
  pca_components: 2
  assignment:
    fixture: tests/fixtures/sample_real_10.csv
  plots:
    dpi: 130
    max_scatter_points: 6000
  final:                                     # Bagian F: analisis lengkap pada himpunan data utama keputusan (ditambahkan ke laporan, tidak menimpa A-E)
    set_name: sesi_5_5_tanpa_tor             # fwd >= 5, bwd >= 5, tanpa Tor
    variant: base
    hdbscan:                                 # grid lebih rapat karena data kecil (~247 flow)
      min_cluster_size: [3, 5, 8, 10, 15, 20, 30, 50]
      min_samples: [1, 2, 3, 5, 8, 10, 15]
    candidate_clusters: [3, 5]               # kandidat terbaik dengan jumlah klaster di rentang ini (inklusif)
    distance_limit_percentile: 95            # batas "jauh dari semua klaster" = persentil ini dari jarak ke centroid sendiri
    report_marker: "<!-- BAGIAN-F -->"
    selection:                               # Bagian G: aturan pemilihan HDBSCAN final
      max_noise_ratio: 0.20
      min_clusters: 2
      min_ari_mean: 0.90                     # ARI bootstrap (analysis.stability) rata-rata; kandidat valid memenuhi semua syarat
      report_marker: "<!-- BAGIAN-G -->"
