data:
  raw_dir: data/raw
  csv_sep: auto              # auto | "," | ";" | "\t"
  time_unit: auto            # auto (ikut format terdeteksi) | s | ms | us
  column_map:                # format dideteksi dari header; nama kolom sumber di-strip dulu
    cic:                     # CIC-IDS2017 asli (CICFlowMeter, GeneratedLabelledFlows)
      time_unit: us
      columns:
        duration: Flow Duration
        iat_mean: Flow IAT Mean
        iat_std: Flow IAT Std
        fwd_packets_count: Total Fwd Packets
        bwd_packets_count: Total Backward Packets
        protocol: Protocol
        src_port: Source Port
        dst_port: Destination Port
    darknet:                 # CIC-Darknet2020 (CICFlowMeter); header memuat "Label" dua kali
      time_unit: us
      columns:
        duration: Flow Duration
        iat_mean: Flow IAT Mean
        iat_std: Flow IAT Std
        fwd_packets_count: Total Fwd Packet
        bwd_packets_count: Total Bwd packets
        protocol: Protocol
        src_port: Src Port
        dst_port: Dst Port
      label_columns:         # opsional; nama sumber -> kolom internal (pandas menamai duplikat "Label.1")
        traffic_type: Label        # Non-Tor | NonVPN | Tor | VPN
        app_category: Label.1      # kategori aplikasi, mis. VOIP
    bccc:                    # BCCC-CIC-IDS2017 (NTLFlowLyzer)
      time_unit: s
      columns:
        duration: duration
        iat_mean: packet_IAT_mean   # belum diuji pada data nyata
        iat_std: packet_IAT_std
        fwd_packets_count: fwd_packets_count
        bwd_packets_count: bwd_packets_count
        protocol: protocol
        src_port: src_port
        dst_port: dst_port
  min_session:               # filter sesi minimum di praproses; null = nonaktif
    fwd: 5                   # minimal paket fwd per flow
    bwd: 5                # minimal paket bwd per flow
  exclude_traffic_types: [Tor]  # mis. [Tor]; dibandingkan tanpa peduli huruf besar/kecil
  max_train_rows: 200000
  random_state: 42
  voip_filter:
    mode: label              # label (app_category == label_value) | port (UDP + port SIP/RTP)
    label_value: VOIP        # dibandingkan tanpa peduli huruf besar/kecil
    protocol: 17
    sip_ports: [5060, 5061]
    rtp_port_ranges: [[10000, 20000], [16384, 32767]]
    min_flows_warning: 200
    fallback_udp_all: false
retrain:                   # latih ulang = unggah CSV (mode Tambah / Ganti), lihat qos.model.dataset
  min_rows: 30               # total baris latih minimum; di bawah ini latih ulang ditolak
  warn_rows: 100             # di bawah ini hasil tetap dilatih tetapi diberi peringatan
experiments:             # varian fitur untuk scripts/compare_variants.py (tidak mengubah model aktif)
  feature_variants:
    A:
      cluster_columns: [iat_mean_us, iat_std_us, fwd_packets_count, bwd_packets_count]
      log_transform: []
    B:
      cluster_columns: [iat_mean_us, iat_std_us, fai_pct]
      log_transform: []
    C:
      cluster_columns: [iat_mean_us, iat_std_us, fai_pct]
      log_transform: [iat_mean_us, iat_std_us]
    C_logfai:                # eksperimen 19 Okt 2026 yang keliru memberi log1p pada FAI; dipertahankan sebagai pembanding
      cluster_columns: [iat_mean_us, iat_std_us, fai_pct]
      log_transform: [iat_mean_us, iat_std_us, fai_pct]
  top_n: 5
eda:
  sensitivity_n: [1, 5, 10, 20, 50]   # nilai N untuk analisis sensitivitas filter sesi (fwd >= N dan bwd >= N)
  sensitivity_exclude: [Tor]          # traffic type yang dikeluarkan pada tampilan "tanpa ..."
  duration_cap_s: 120                 # batas durasi flow CICFlowMeter (flow terpotong)
  duration_cap_tol_ms: 1              # durasi dalam toleransi ini dari batas dianggap "menempel"
  suspect_ports: [53, 123, 137, 138, 1900, 5353]   # port lawan yang kemungkinan bukan VoIP (hanya laporan)
features:
  fai_clip_negative: true    # FAI < 0 (bwd > fwd) dijadikan 0
  delay_column: iat_mean_us    # proksi delay (µs) → delay_ms
  jitter_column: iat_std_us    # jitter (µs) → jitter_ms
  cluster_columns: [iat_mean_us, iat_std_us, fai_pct]   # Varian C (dipilih 19 Okt 2026); boleh memuat turunan fai_pct
  log_transform: [iat_mean_us, iat_std_us]              # di-log1p sebelum StandardScaler; fai_pct TIDAK di-log
hdbscan:
  min_cluster_size: 3         # parameter tetap bila grid search dimatikan atau tidak ada kandidat valid
  min_samples: 8
  cluster_selection_method: eom
  grid_search:
    enabled: true
    min_cluster_size: [3, 5, 8, 10, 15, 20, 30, 50]
    min_samples: [1, 2, 3, 5, 8, 10, 15]
    silhouette_sample_size: 10000
  selection:                  # aturan pemilihan final (analisis bagian G): DBCV tertinggi di antara kandidat valid; seri -> Silhouette
    max_noise_ratio: 0.20
    min_clusters: 2
    min_ari_mean: 0.90        # ARI bootstrap rata-rata minimum
  stability:
    n_bootstrap: 50
    fraction: 0.8
kmeans:                       # pembanding: k optimal (rata-rata peringkat Silhouette & DBI) dan k = jumlah klaster HDBSCAN
  k_min: 2
  k_max: 10
  n_init: 10
  rank_metrics: [silhouette, davies_bouldin]
assignment:                   # penugasan Euclidean ke centroid dan batas "di luar klaster"
  limit_percentile: 95
  limit_rule: max_cluster_global   # per_cluster | global | max_cluster_global (= max(p klaster, p global))
evaluation:
  silhouette_bands: [0.70, 0.50, 0.25]   # Strong > 0,70; Reasonable > 0,50; Weak > 0,25; selebihnya No Substantial
  noise_ideal: [0.01, 0.10]            # Noise Ratio ideal (inklusif)
  noise_too_strict: 0.20               # di atas ini dianggap terlalu ketat
  target_silhouette: 0.50              # target RM6 (dilaporkan, bukan test gagal)
  pca_sample_size: 5000                # maks titik latih untuk latar scatter PCA
  dbcv_max_points: 5000                # DBCV O(n^2): di atas ini dihitung pada subsampel acak
profiling:
  jitter_percentile: 99.9   # persentil jitter pada statistik tambahan profil klaster (P99,9)
  max_outliers: 500         # maks pencilan yang disimpan per metrik per klaster
recommendations:
  enabled: true              # false = tanpa "Saran berdasarkan karakteristik klaster" (UI, PDF)
thresholds:                  # hanya untuk deskripsi klaster, garis referensi grafik, dan saran; TIDAK memengaruhi klasterisasi
  delay_good_ms: 150.0
  delay_max_ms: 400.0
  jitter_max_ms: 50.0
  loss_good_pct: 1.0   # ≤ ini level 1 (ITU-T G.1010 conversational voice PLR < 3%; panduan Cisco VoIP ≤ 1%)
  loss_max_pct: 3.0    # ≤ ini level 2; di atasnya level 3
monitoring:
  capture_backend: scapy     # scapy (default sejak 19 Okt 2026) | pyshark | replay
  bpf_filter: "udp and not port 443 and not port 53 and not port 123 and not port 5353 and not port 1900"   # buang QUIC/DNS/NTP/mDNS/SSDP
  tshark_path: null          # kosong = cari di PATH dan lokasi instalasi Wireshark
  live_poll_sec: 0.5         # detak sumber live saat tidak ada paket (menutup jendela tepat waktu)
  window_sec: 5
  flow_idle_timeout_sec: 120   # flow tanpa paket selama ini dianggap selesai dan dibuang dari flow table
  call_end_idle_sec: 10        # panggilan yang ditutup cepat: idle selama ini = panggilan selesai (efektif min dengan flow_idle_timeout_sec)
  feature_mode: cumulative   # cumulative (default) | window
  signaling_ports: [5060, 5061]   # flow dengan port ini = "Sinyal SIP": tidak diprediksi, bukan panggilan
  min_packets_per_window: 10
  sparkline_windows: 20   # jumlah jendela terakhir pada sparkline kartu panggilan aktif
  exit_join_sec: 5        # tunggu worker saat aplikasi ditutup tanpa Stop sebelum ringkasan abnormal ditulis
  orphan_after_sec: 120   # CSV jendela tanpa ringkasan dan tak berubah selama ini dianggap sesi terputus
  min_session_live:          # flow/jendela di bawah ini tidak diprediksi ("Data Belum Cukup"); null = nonaktif
    fwd: 5
    bwd: 5
  refresh_sec: 2
  replay_speed: 1.0
paths:
  artifacts_dir: artifacts
  reports_dir: reports
  logs_dir: logs
  recommendations_file: config/recommendations.yaml
