[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voip-qos-hdbscan"
version = "0.1.0"
description = "Pemetaan karakteristik trafik VoIP untuk identifikasi QoS menggunakan HDBSCAN"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
